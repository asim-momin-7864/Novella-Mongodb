services:
  postgres:
    image: postgres:latest
    container_name: novella-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev54321
      POSTGRES_DB: novella
    volumes:
      - postgres_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  novella-api:
    build: .
    container_name: novella-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file:
      - .env
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  postgres_data:
    driver: local
